name: video-demo film one scene

on:
  push:
    branches: [feat/new-smooth-intro-video-gif]
    paths:
      - '.github/video-demo/**'
      - '.github/workflows/video-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  film:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - name: Fetch pinned nilbuild/video-demo
        env:
          ENGINE_SHA: 767bfb818880c9f38bb02873d3d67141a3e62250
        run: |
          git clone -q https://github.com/nilbuild/video-demo.git "$RUNNER_TEMP/video-demo"
          git -C "$RUNNER_TEMP/video-demo" checkout --detach "$ENGINE_SHA"
      - name: Install browser studio on ephemeral runner
        run: "$RUNNER_TEMP/video-demo/scripts/install.sh"
      - name: Install local narration model
        shell: bash
        run: |
          set -e
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          "$RUNNER_TEMP/video-demo/scripts/install-voice.sh"
      - name: Scaffold public-site workspace
        run: |
          node "$RUNNER_TEMP/video-demo/scripts/scaffold.mjs" --site https://github.com/alifakbxr/product-ui --project "$RUNNER_TEMP/product-ui-video-demo"
          cp .github/video-demo/demo.config.ts "$RUNNER_TEMP/product-ui-video-demo/demo.config.ts"
          rm -f "$RUNNER_TEMP/product-ui-video-demo/scenes/smoke.scene.ts"
          cp .github/video-demo/scenes/voice-track.scene.ts "$RUNNER_TEMP/product-ui-video-demo/scenes/voice-track.scene.ts"
      - name: Film one narrated scene
        env:
          DEMO_VOICE: '1'
          DEMO_TOUR: '0'
          DEMO_TRACE_FRAMES: '1'
        run: |
          "$RUNNER_TEMP/video-demo/scripts/demo" --project "$RUNNER_TEMP/product-ui-video-demo" --grep voice-track
      - name: Upload original capture, stills and frame timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-ui-video-demo-narration
          path: ${{ runner.temp }}/product-ui-video-demo/demo-out/
          retention-days: 7
