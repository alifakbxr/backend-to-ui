name: Generate new intro assets

on:
  push:
    branches: [feat/new-smooth-intro-video-gif]
    paths:
      - scripts/render_intro.py
      - .github/workflows/render-intro.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-inter ffmpeg
          python3 -m pip install --break-system-packages Pillow
      - name: Render deterministic product film
        run: python3 scripts/render_intro.py --out media
      - name: Create smooth looping GIF from the same video
        run: |
          ffmpeg -hide_banner -loglevel error -y -i media/intro.mp4 \
            -filter_complex 'fps=15,scale=800:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=96:stats_mode=diff[p];[s1][p]paletteuse=dither=bayer:bayer_scale=4:diff_mode=rectangle' \
            -loop 0 media/intro.gif
      - name: Verify video and GIF
        run: |
          set -e
          test -s media/intro.mp4
          test -s media/intro.gif
          test -s media/cover.png
          python3 tests/validate.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Commit generated binary media to the PR branch
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/intro.mp4 media/intro.gif media/cover.png
          git commit -m 'chore: render new smooth intro MP4 and GIF [skip ci]'
          git push origin HEAD:feat/new-smooth-intro-video-gif
