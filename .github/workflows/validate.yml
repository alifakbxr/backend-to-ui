name: Validate skill

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Ensure ffprobe is available for media verification
        shell: bash
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Validate structure and documentation
        run: python3 tests/validate.py
      - name: Test behavioral evaluation rules and scenarios
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
